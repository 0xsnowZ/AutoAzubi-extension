<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AutoAzubi Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1 data-i18n="titleText">AutoAzubi Extractor</h1>
        <p class="subtitle" data-i18n="subtitleText">
          Automated Data Extractor
        </p>
        <div class="lang-toggle">
          <button id="lang-en" class="lang-btn active">EN</button>
          <button id="lang-ar" class="lang-btn">عربي</button>
        </div>
      </header>

      <!-- Tabs Navigation -->
      <div class="tabs">
        <button id="tab-jobs" class="tab-btn active">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <span style="margin-left: 4px" data-i18n="tabJobs">Job Portals</span>
        </button>
        <button id="tab-gmaps" class="tab-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span style="margin-left: 4px" data-i18n="tabGmaps">Google Maps</span>
        </button>
      </div>

      <!-- Main Scraper View -->
      <div id="main-view" class="view active-view">
        <div class="status-card" id="status-card">
          <div class="status-info">
            <h2 data-i18n="statusTitle">Current Status</h2>
            <div id="status-text" class="status-idle" data-i18n="statusIdle">
              Idle
            </div>
            <!-- Activity ticker -->
            <div id="activity-log" class="activity-log">Ready to start...</div>
          </div>
          <div class="counter">
            <span id="scraped-count">0</span>
            <span class="count-sep">/</span>
            <span id="total-found">?</span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container" id="progress-container">
          <div
            class="progress-bar progress-striped active"
            id="progress-bar"
          ></div>
        </div>

        <div class="controls" style="margin-top: 16px">
          <div class="input-group">
            <label for="fetch-limit" data-i18n="targetLabel"
              >Target Number of Offers</label
            >
            <input type="number" id="fetch-limit" value="50" min="1" />
          </div>

          <div class="btn-row" id="initial-btns">
            <button id="start-btn" class="primary-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span data-i18n="startBtn">Start Scraping</span>
            </button>
            <button id="count-btn" class="secondary-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="20" x2="12" y2="10"></line>
                <line x1="18" y1="20" x2="18" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="16"></line>
              </svg>
              <span data-i18n="countBtn">Count</span>
            </button>
            <button id="reset-btn" class="danger-btn">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
              </svg>
              <span data-i18n="resetBtn">Reset</span>
            </button>
          </div>

          <div class="btn-row hidden" id="ongoing-btns">
            <button id="pause-btn" class="warning-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
              <span data-i18n="pauseBtn">Pause</span>
            </button>
            <button id="resume-btn" class="primary-btn hidden">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span data-i18n="resumeBtn">Resume</span>
            </button>
            <button id="stop-btn" class="danger-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              </svg>
              <span data-i18n="stopBtn">Stop</span>
            </button>
          </div>

          <!-- Portals Grid -->
          <div class="portals-grid" id="navigation-btns">
            <button
              id="arbeitsagentur-btn"
              class="portal-btn"
              data-i18n="arbBtn"
            >
              Arbeitsagentur
            </button>
            <button id="ausbildung-btn" class="portal-btn" data-i18n="ausBtn">
              Ausbildung
            </button>
            <button id="aubiplus-btn" class="portal-btn" data-i18n="aubiBtn">
              Aubi-Plus
            </button>
            <button id="azubi-btn" class="portal-btn" data-i18n="azubiBtn">
              Azubi
            </button>
          </div>

          <!-- Collapsible Settings -->
          <details class="settings-section">
            <summary data-i18n="settingsTitle">Settings</summary>
            <div class="settings-content">
              <div class="setting-item">
                <label>
                  <input type="checkbox" id="notify-captcha" checked />
                  <span data-i18n="captchaLabel">Captcha Sound</span>
                </label>
              </div>
              <div class="setting-item">
                <label>
                  <input type="checkbox" id="notify-finish" checked />
                  <span data-i18n="finishLabel">Finish Sound</span>
                </label>
              </div>
              <div
                class="instructions"
                style="margin-top: 8px; margin-bottom: 0"
              >
                <p>
                  <strong data-i18n="noteTitle">Note:</strong>
                  <span data-i18n="noteDesc"
                    >Solve captchas manually if they appear to keep the scraper
                    running.</span
                  >
                </p>
              </div>
            </div>
          </details>

          <button id="download-btn" disabled class="success-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-i18n="downloadBtn">Download CSV Results</span>
          </button>
        </div>
      </div>

      <!-- Google Maps Settings View -->
      <div id="gmaps-view" class="view">
        <h2 class="view-title" data-i18n="gmapsTitle">Google Maps Scraper</h2>
        <div class="input-group">
          <label for="gmaps-keyword" data-i18n="gmapsKwParams">Keyword</label>
          <input
            type="text"
            id="gmaps-keyword"
            placeholder="Enter keyword..."
            class="input-field"
          />
        </div>
        <div class="input-group">
          <label for="gmaps-city" data-i18n="gmapsCityParams">City</label>
          <input
            type="text"
            id="gmaps-city"
            placeholder="Enter city..."
            class="input-field"
          />
        </div>
        <div class="view-actions">
          <button id="gmaps-search-btn" class="primary-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span data-i18n="gmapsSearchBtn">Search on Maps</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Custom Modal for Alerts -->
    <div class="modal-overlay" id="confirmModal">
      <div class="custom-modal">
        <h3>Clear Data</h3>
        <p>Are you sure you want to clear all scraped data?</p>
        <div class="modal-btns">
          <button id="modalCancel" class="btn-cancel">Cancel</button>
          <button id="modalConfirm" class="btn-confirm">Clear All</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
