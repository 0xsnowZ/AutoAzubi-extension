<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AutoAzubi Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1 data-i18n="titleText">AutoAzubi Extractor</h1>
        <p class="subtitle" data-i18n="subtitleText">
          Automated Data Extractor
        </p>
        <div class="lang-toggle">
          <button id="lang-en" class="lang-btn active">EN</button>
          <button id="lang-ar" class="lang-btn">عربي</button>
        </div>
      </header>

      <!-- Main Scraper View -->
      <div id="main-view" class="view">
        <div class="status-card">
          <div class="status-info">
            <h2 data-i18n="statusTitle">Current Status</h2>
            <div id="status-text" class="status-idle" data-i18n="statusIdle">
              Idle
            </div>
          </div>
          <div class="counter">
            <span id="scraped-count">0</span>
            <span class="count-sep">/</span>
            <span id="total-found">?</span>
          </div>
        </div>

        <div class="controls">
          <div class="input-group">
            <label for="fetch-limit" data-i18n="targetLabel"
              >Target Number of Offers</label
            >
            <input type="number" id="fetch-limit" value="50" min="1" />
          </div>

          <div class="btn-row" id="initial-btns">
            <button id="count-btn" data-i18n="countBtn">Count Available</button>
            <button id="start-btn" data-i18n="startBtn">Start Scraping</button>
            <button id="reset-btn" class="secondary-btn" data-i18n="resetBtn">
              Reset
            </button>
          </div>

          <div class="btn-row hidden" id="ongoing-btns">
            <button id="pause-btn" data-i18n="pauseBtn">Pause</button>
            <button id="resume-btn" class="hidden" data-i18n="resumeBtn">
              Resume
            </button>
            <button id="stop-btn" data-i18n="stopBtn">Stop</button>
          </div>

          <div
            class="btn-row"
            id="navigation-btns"
            style="
              margin-top: 16px;
              display: flex;
              flex-direction: column;
              gap: 8px;
            "
          >
            <button
              id="arbeitsagentur-btn"
              class="secondary-btn"
              data-i18n="arbBtn"
            >
              Open Arbeitsagentur
            </button>
            <button
              id="ausbildung-btn"
              class="secondary-btn"
              data-i18n="ausBtn"
            >
              Open Ausbildung.de
            </button>
            <button id="aubiplus-btn" class="secondary-btn" data-i18n="aubiBtn">
              Open Aubi-Plus.de
            </button>
            <button id="azubi-btn" class="secondary-btn" data-i18n="azubiBtn">
              Open Azubi.de
            </button>
            <button id="gmaps-btn" class="secondary-btn" data-i18n="gmapsBtn">
              Open Google Maps
            </button>
          </div>

          <div class="settings-section">
            <h3 data-i18n="settingsTitle">Settings</h3>
            <div class="setting-item">
              <label>
                <input type="checkbox" id="notify-captcha" checked />
                <span data-i18n="captchaLabel">Captcha Sound</span>
              </label>
            </div>
            <div class="setting-item">
              <label>
                <input type="checkbox" id="notify-finish" checked />
                <span data-i18n="finishLabel">Finish Sound</span>
              </label>
            </div>
          </div>

          <div class="instructions">
            <p>
              <strong data-i18n="noteTitle">Note:</strong>
              <span data-i18n="noteDesc"
                >Solve captchas manually if they appear to keep the scraper
                running.</span
              >
            </p>
          </div>

          <button id="download-btn" disabled data-i18n="downloadBtn">
            Download CSV Results
          </button>
        </div>
      </div>

      <!-- Google Maps Settings View -->
      <div id="gmaps-view" class="view hidden">
        <h2
          style="
            margin-bottom: 15px;
            font-size: 18px;
            font-family: &quot;Outfit&quot;, sans-serif;
          "
          data-i18n="gmapsTitle"
        >
          Google Maps Scraper
        </h2>
        <div class="input-group">
          <label for="gmaps-keyword" data-i18n="gmapsKwParams">Keyword</label>
          <input
            type="text"
            id="gmaps-keyword"
            placeholder="e.g. Restaurants"
            style="margin-bottom: 16px"
          />
        </div>
        <div class="input-group">
          <label for="gmaps-city" data-i18n="gmapsCityParams">City</label>
          <input
            type="text"
            id="gmaps-city"
            placeholder="e.g. Berlin"
            style="margin-bottom: 16px"
          />
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <button
            id="gmaps-search-btn"
            data-i18n="gmapsSearchBtn"
            style="background: var(--accent); color: white"
          >
            Search on Maps
          </button>
          <button
            id="gmaps-back-btn"
            class="secondary-btn"
            data-i18n="gmapsBackBtn"
          >
            Back
          </button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
